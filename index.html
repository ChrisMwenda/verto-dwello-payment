<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Deal Wallets Mockup</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Space+Grotesk:wght@500;600&display=swap">
<style>
/* Layout: the DwellOS app (navy bar, deal page, Payments page) on the left; a demo rail on the right that
   drives the story and shows what DwellOS and Verto do behind each click. Single light theme on purpose:
   this is a picture of the product, which ships light. */
:root{
  --chrome:#0a1e3f;--chrome-ink-2:#c3cee0;--chrome-ink-3:#7f93b5;--chrome-line:#26406a;
  --ink:#0a1e3f;--ink-2:#45566e;--ink-3:#5b6b82;
  --ground:#f7f8fa;--surface:#ffffff;--sunk:#f1f3f7;
  --line:#e7eaf0;--line-strong:#dfe3ea;--line-bold:#c9d1dc;
  --accent:#2e6bff;--accent-hover:#1b4bd6;--accent-text:#1b4bd6;--accent-tint:#f4faff;--accent-line:#d6e6ff;
  --warn-text:#8a5200;--warn-tint:#fdf4e7;--warn-line:#f0dfc2;
  --good-text:#1f6b45;--good-tint:#eef8f2;--good-line:#cfe8d9;
  --code-bg:#0f1b30;--code-ink:#d7e1f2;--code-dim:#7f93b5;--code-key:#9fc2ff;--code-str:#b5e3c4;
  --sans:"IBM Plex Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --data:"Space Grotesk",ui-sans-serif,system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
body{background:var(--ground);color:var(--ink-2);font:15px/1.5 var(--sans)}
button{font:inherit}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.shell{display:grid;grid-template-columns:minmax(0,1fr) 380px;min-height:100%}
body.clean .shell{grid-template-columns:minmax(0,1fr)}
body.clean .rail{display:none}
@media (max-width:1100px){.shell{grid-template-columns:minmax(0,1fr)}}

/* app chrome */
.bar[hidden]{display:none}
.bar{background:var(--chrome);color:#fff;display:flex;flex-wrap:wrap;align-items:center;gap:6px 22px;padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-height:56px}
.brand{font:600 17px var(--data);letter-spacing:.01em;display:flex;align-items:center;gap:8px}
.brand i{width:22px;height:22px;border-radius:5px;background:#fff;display:inline-block;position:relative}
.brand i::after{content:"";position:absolute;inset:6px;border-radius:2px;background:var(--chrome)}
.proj{font-size:14px;color:var(--chrome-ink-2);border:1px solid var(--chrome-line);border-radius:4px;padding:4px 10px}
.nav{display:flex;flex-wrap:wrap;gap:2px}
.nav button{background:none;border:0;color:var(--chrome-ink-2);padding:17px 10px;font-size:14px;cursor:pointer;border-bottom:2px solid transparent}
.nav button:hover{color:#fff}
.nav button[aria-current="page"]{color:#fff;font-weight:600;border-bottom-color:#fff}
.nav .new{font-size:10px;font-weight:600;letter-spacing:.08em;background:var(--accent);color:#fff;border-radius:2px;padding:1px 5px;margin-left:6px;vertical-align:2px}
.page{padding-block:24px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:20px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:4px}
.cap{font:600 11px var(--data);letter-spacing:.2em;text-transform:uppercase;color:var(--ink-3);margin:0}
h1{margin:0;font:600 28px/1.2 var(--sans);color:var(--ink);text-wrap:balance}
h2{margin:0;font-size:17px;font-weight:600;color:var(--ink)}
.btn{height:38px;padding:0 14px;border:1px solid var(--line-strong);background:var(--surface);border-radius:4px;font-weight:500;font-size:14px;color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--line-bold)}
.btn-p{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn-p:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn-s{height:32px;font-size:13px;padding:0 10px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.tag{font-size:12px;font-weight:600;border-radius:2px;padding:1px 7px;border:1px solid;white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.t-good{color:var(--good-text);background:var(--good-tint);border-color:var(--good-line)}
.t-warn{color:var(--warn-text);background:var(--warn-tint);border-color:var(--warn-line)}
.t-info{color:var(--accent-text);background:var(--accent-tint);border-color:var(--accent-line)}
.t-mute{color:var(--ink-3);background:var(--sunk);border-color:var(--line)}
.num{font-family:var(--data);font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-size:13px}
.flash{animation:flash 1.4s ease-out}
@keyframes flash{0%{box-shadow:0 0 0 3px var(--accent-line);background:var(--accent-tint)}100%{box-shadow:0 0 0 0 transparent}}
.spin{width:12px;height:12px;border-radius:50%;border:2px solid var(--warn-line);border-top-color:var(--warn-text);animation:spin .8s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.flash,.spin{animation:none}}

/* deal header */
.head{display:flex;flex-wrap:wrap;gap:16px;align-items:center}
.avatar{width:56px;height:56px;border-radius:28px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font:600 18px var(--data);flex:none}
.tabs{display:flex;flex-wrap:wrap;border-bottom:1px solid var(--line-strong)}
.tabs>span{padding:12px 4px;margin-right:24px;font-size:15px;color:var(--ink-2);border-bottom:2px solid transparent;margin-bottom:-1px;display:inline-flex;gap:8px;align-items:center}
.tabs>.on{color:var(--ink);font-weight:600;border-bottom-color:var(--ink)}
.n{align-self:center;line-height:18px;font-size:12px;font-weight:500;color:var(--ink-2);background:var(--sunk);border-radius:10px;padding:1px 8px}
.cols{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
.main{flex:999 1 560px;min-width:0;display:flex;flex-direction:column;gap:20px}
.side{flex:1 1 300px;min-width:0;max-width:380px;display:flex;flex-direction:column;gap:20px}
.sec{padding:20px;display:flex;flex-direction:column;gap:14px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.sub{font-size:14px;color:var(--ink-3);margin:0}

.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.checks li{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 0;border-top:1px solid var(--line)}
.checks li:first-child{border-top:0;padding-top:2px}
.ck{width:24px;height:24px;border-radius:12px;flex:none;display:flex;align-items:center;justify-content:center}
.ck.done{background:var(--ink)}
.ck.todo{border:2px solid var(--line-bold)}
.ck-body{flex:1 1 240px;display:flex;flex-direction:column;gap:1px;min-width:0}
.ck-body b{font-weight:500;color:var(--ink)}
.ck-body small{font-size:13px;color:var(--ink-3)}
.ready{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 14px;border-radius:4px;border:1px solid var(--good-line);background:var(--good-tint);color:var(--good-text);font-size:14px}
.locked{display:flex;gap:12px;align-items:center;padding:14px;border-radius:4px;border:1px dashed var(--line-bold);background:var(--sunk);font-size:14px;color:var(--ink-3)}

.pick{display:flex;flex-wrap:wrap;gap:8px}
.pick label{display:flex;align-items:center;gap:8px;border:1px solid var(--line-strong);border-radius:4px;padding:8px 12px;font-size:14px;color:var(--ink);cursor:pointer;background:var(--surface)}
.pick label:has(input:checked){border-color:var(--ink);background:var(--accent-tint)}
.pick input{accent-color:var(--ink)}

.wallets{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.wallet{border:1px solid var(--line-strong);border-radius:4px;padding:16px;display:flex;flex-direction:column;gap:12px;background:var(--surface)}
.w-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ccy{font:600 15px var(--data);color:var(--ink);display:flex;align-items:center;gap:12px}
.ccy .cn{display:flex;flex-direction:column;line-height:1.2}
.ccy .cn small{font:500 12px var(--sans);color:var(--ink-3);letter-spacing:.04em}
.flag{display:block;flex:none;border-radius:50%;box-shadow:0 0 0 1px var(--line-strong),0 1px 3px rgba(10,30,63,.18)}
.wallet{border-top-width:4px}
.wallet.c-KES{border-top-color:#1f6b45}.wallet.c-USD{border-top-color:#3c3b6e}.wallet.c-GBP{border-top-color:#c8102e}.wallet.c-EUR{border-top-color:#003399}
.pick .flag{box-shadow:0 0 0 1px var(--line-strong)}
.seg span{display:inline-flex;align-items:center;gap:6px}
.inl{display:inline-flex;align-items:center;gap:8px}
.ccy i{font-style:normal;width:34px;height:34px;border-radius:17px;background:var(--sunk);display:flex;align-items:center;justify-content:center;font-size:12px;letter-spacing:.04em;color:var(--ink)}
.bal{display:flex;flex-direction:column;gap:2px}
.bal span{font-size:13px;color:var(--ink-3)}
.bal strong{font:600 22px var(--data);color:var(--ink);font-variant-numeric:tabular-nums}
.acct{background:var(--sunk);border-radius:4px;padding:12px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;font-size:13px}
.acct dt{color:var(--ink-3)}
.acct dd{margin:0;color:var(--ink);font-family:var(--data);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.acct.wait{display:flex;gap:10px;align-items:center;color:var(--warn-text);background:var(--warn-tint)}

.money{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.tile{padding:16px;display:flex;flex-direction:column;gap:6px}
.tile span{font-size:13px}
.tile strong{font:600 20px var(--data);color:var(--ink);font-variant-numeric:tabular-nums}

.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font:600 11px var(--data);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);padding:0 12px 10px 0;border-bottom:1px solid var(--line-bold);white-space:nowrap}
td{padding:12px 12px 12px 0;border-bottom:1px solid var(--line);vertical-align:top;color:var(--ink)}
td small{display:block;font-size:12.5px;color:var(--ink-3)}
td.r,th.r{text-align:right}
tr:last-child td{border-bottom:0}

.feed{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:0}
.feed li{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line);font-size:14px}
.feed li:first-child{border-top:0;padding-top:0}
.dot{width:10px;height:10px;border-radius:5px;margin-top:6px;flex:none;background:var(--line-bold)}
.dot.in{background:var(--good-text)}
.dot.mv{background:var(--accent)}
.feed b{font-weight:500;color:var(--ink)}
.feed small{display:block;color:var(--ink-3);font-size:13px}

/* payments page */
.spv{display:flex;gap:16px;flex-wrap:wrap;align-items:center;padding:16px 20px}
.spv-name{flex:1 1 260px;display:flex;flex-direction:column;gap:2px}
.spv-name b{font-weight:600;color:var(--ink);font-size:16px}
.pw{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.pw .wallet{gap:8px}
.asof{font-size:12.5px;color:var(--ink-3)}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:13px;border:1px solid var(--line-strong);border-radius:14px;padding:3px 11px;background:var(--surface);color:var(--ink-2)}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}

/* demo rail */
.rail{background:var(--surface);border-left:1px solid var(--line-strong);display:flex;flex-direction:column;min-width:0}
@media (max-width:1100px){.rail{border-left:0;border-top:1px solid var(--line-strong)}}
.rail-in{position:sticky;top:0;display:flex;flex-direction:column;gap:16px;padding-block:20px 28px;padding-left:20px;padding-right:max(20px,env(safe-area-inset-right,0px));max-height:100vh;overflow:auto}
@media (max-width:1100px){.rail-in{position:static;max-height:none;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}}
.rail h2{font-size:15px}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px;counter-reset:s}
.steps li{display:flex;gap:10px;align-items:center;font-size:14px;padding:6px 8px;border-radius:4px;color:var(--ink-3)}
.steps li::before{counter-increment:s;content:counter(s);width:22px;height:22px;border-radius:11px;border:1.5px solid var(--line-bold);display:flex;align-items:center;justify-content:center;font:600 11px var(--data);flex:none}
.steps li.done{color:var(--ink)}
.steps li.done::before{content:"✓";background:var(--ink);border-color:var(--ink);color:#fff}
.steps li.next{background:var(--accent-tint);color:var(--ink);font-weight:600}
.steps li.next::before{border-color:var(--accent);color:var(--accent-text)}
.rail-btns{display:flex;gap:8px;flex-wrap:wrap}
.log{display:flex;flex-direction:column;gap:10px}
.entry{border:1px solid var(--line);border-radius:4px;overflow:hidden}
.entry-h{padding:8px 12px;font-size:13px;font-weight:600;color:var(--ink);background:var(--sunk);display:flex;justify-content:space-between;gap:8px}
.entry-h em{font-style:normal;font-weight:500;color:var(--ink-3)}
.entry p{margin:0;padding:8px 12px;font-size:13px;line-height:1.5;color:var(--ink-2)}
.entry pre{margin:0;padding:10px 12px;background:var(--code-bg);color:var(--code-ink);font:12px/1.55 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere}
.entry pre .c{color:var(--code-dim)}
.entry pre .k{color:var(--code-key)}
.entry pre .s{color:var(--code-str)}
.who{font:600 10px var(--data);letter-spacing:.12em;text-transform:uppercase;padding:1px 6px;border-radius:2px}
.who.d{background:var(--ink);color:#fff}
.who.v{background:var(--accent);color:#fff}
.sample{font-size:12px;color:var(--ink-3)}

/* buyer portal: the buyer's own app, lighter and simpler than the team's */
.ptop{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding-bottom:16px;border-bottom:1px solid var(--line-strong)}
.ptop .brand2{font:600 18px var(--data);color:var(--ink)}
.ptop .brand2 small{display:block;font:500 12px var(--sans);color:var(--ink-3)}
.pcols{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:760px){.pcols{grid-template-columns:minmax(0,1fr)}}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:4px;overflow:hidden}
.seg span{padding:6px 16px;font-size:14px;color:var(--ink-2)}
.seg .on{background:var(--ink);color:#fff;font-weight:600}
.quote{border:1px solid var(--accent-line);background:var(--accent-tint);border-radius:6px;padding:18px;display:flex;flex-direction:column;gap:6px}
.quote .big{font:600 34px var(--data);color:var(--ink);font-variant-numeric:tabular-nums;line-height:1.1}
.quote .gets{font-size:15px;color:var(--ink)}
.rate{font-size:13px;color:var(--ink-3);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ring{width:16px;height:16px;border-radius:50%;background:conic-gradient(var(--accent) var(--pct,80%),var(--line) 0);display:inline-block}
.note{font-size:13px;color:var(--ink-3)}
.autop{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border:1px solid var(--line-strong);border-radius:4px;cursor:pointer;font-size:14px}
.autop input{margin-top:3px;accent-color:var(--ink)}
.autop b{color:var(--ink);font-weight:500;display:block}
.autop small{color:var(--ink-3);font-size:13px}
</style>

<div class="shell">
  <div class="app">
    <header class="bar" id="appbar">
      <span class="brand"><i aria-hidden="true"></i>DwellOS</span>
      <span class="proj">Riverside Gardens ▾</span>
      <nav class="nav" aria-label="Main">
        <button type="button">Overview</button>
        <button type="button" data-view="deal" id="nav-deals">Deals</button>
        <button type="button">Inventory</button>
        <button type="button">Partners</button>
        <button type="button" data-view="payments" id="nav-payments">Payments<span class="new">NEW</span></button>
        <button type="button">Reports</button>
      </nav>
    </header>
    <main class="page"><div class="wrap" id="view"></div></main>
  </div>
  <aside class="rail" aria-label="Demo controls">
    <div class="rail-in">
      <div style="display:flex;flex-direction:column;gap:4px">
        <p class="cap">Demo</p>
        <h2>Jane pays for B-204</h2>
        <p class="sub">Click <b>Next step</b>, or use the buttons on the page. Each step shows what DwellOS and Verto do behind it.</p>
      </div>
      <ol class="steps" id="steps"></ol>
      <div class="rail-btns">
        <button type="button" class="btn btn-p" id="next">Next step</button>
        <button type="button" class="btn" id="reset">Start again</button>
      </div>
      <div class="rail-btns"><button type="button" class="btn btn-s" data-view="portal">Jane's buyer portal</button><button type="button" class="btn btn-s" data-view="deal">Deal page</button><button type="button" class="btn btn-s" data-view="payments">Payments page</button></div>
      <div style="display:flex;flex-direction:column;gap:8px">
        <p class="cap">Behind the scenes</p>
        <div class="log" id="log"></div>
      </div>
    </div>
  </aside>
</div>

<script>
const SUB = "9698"; // Riverside Gardens SPV Ltd's Verto sub-account (sandbox id seen in probes)
const STEPS = [
  {label:"Check Jane's ID", view:"deal"},
  {label:"Run the background check", view:"deal"},
  {label:"Create Jane's wallets", view:"deal"},
  {label:"Get the bank details", view:"deal"},
  {label:"Jane pays KES 450,000", view:"deal"},
  {label:"Move it to the project wallet", view:"payments"},
  {label:"Jane sees what to send in USD", view:"portal"},
  {label:"Her USD lands and waits for her", view:"portal"},
  {label:"Jane clicks Pay now", view:"portal"},
];
const LOG = [
  {title:"ID check passed", who:"d", text:"DwellOS checks Jane's passport against a selfie, through our own ID provider. Verto is not called. Nothing about money can happen yet.",
   code:`<span class="c"># DwellOS only</span>
deal_parties.jane  identity_check = <span class="s">passed</span>`},
  {title:"Background check passed", who:"d", text:"DwellOS screens Jane for sanctions, politically exposed persons and bad press (AML). If this fails, we stop here, before anything reaches Verto's rails.",
   code:`<span class="c"># DwellOS only</span>
deal_parties.jane  aml_screening = <span class="s">clear</span>
deal B-204         payment_readiness = <span class="s">ready</span>`},
  {title:"Wallets created", who:"v", text:"DwellOS logs in AS the project's sub-account, then creates one wallet per currency for this deal. Verto only sees two more wallets. DwellOS records which deal they belong to.",
   code:`<span class="k">POST</span> /sub-accounts/${SUB}/login        <span class="c"># 1-hour token for the SPV</span>
<span class="k">POST</span> /${SUB}/wallets  {currency:<span class="s">"KES"</span>, type:<span class="s">"standard"</span>,
       customReferenceLabel:<span class="s">"deal B-204 Jane Wanjiku"</span>}
<span class="k">POST</span> /${SUB}/wallets  {currency:<span class="s">"USD"</span>, …}
<span class="c"># DwellOS: wallets.deal_id = B-204  (role: deal)</span>`},
  {title:"Bank details ready", who:"v", text:"For each new wallet DwellOS asks Verto to make a real bank account. The account starts as pending; DwellOS checks again until a number appears, then shows it to Jane.",
   code:`<span class="k">GET</span> /${SUB}/wallets/50211/fundingMethods?autoCreate=<span class="s">true</span>
<span class="c"># → status "Creation in progress" … then account number</span>
<span class="k">GET</span> /${SUB}/wallets/50212/fundingMethods?autoCreate=<span class="s">true</span>`},
  {title:"Money received", who:"v", text:"Jane sends KES 450,000 from her bank to the KES account. The wallet it landed in tells DwellOS whose money it is. No reference to match. DwellOS confirms with Verto, then pays off the next item on her plan.",
   code:`<span class="c"># webhook</span>  ibanToWallet.completed  walletId=50211
<span class="k">POST</span> /payments/list  {paymentIds:[…]}   <span class="c"># confirm, never trust the webhook alone</span>
<span class="c"># DwellOS: wallet 50211 → deal B-204 → "Reservation fee" paid</span>`},

  else main = `
      <div class="sec-h"><h2 id="pay-h">Your next payment</h2><span class="seg"><span>${flag("KES",18)}KES</span><span class="on">${flag("USD",18)}USD</span></span></div>
      <div><span class="sub">${next.what} · due ${next.due}</span><div class="num" style="font:600 20px var(--data);color:var(--ink)">${fmt("KES",next.amt)}</div></div>
      <div class="quote${justDone===6?" flash":""}">
        <span class="sub">Today that is about</span>
        <span class="big" id="q-usd">${fmt("USD",usd)}</span>
        <span class="rate"><span class="ring" id="q-ring"></span><span id="q-rate">1 USD = KES ${rate.toFixed(2)} · new rate in ${left}s</span></span>
      </div>
      <p class="note">Send your dollars any time. They wait in your wallet until you pay. Then you see the exact price and have 60 seconds to accept it. Sending a little extra is fine: what is left stays for next time.</p>`;
  return `
  <div class="ptop"><span class="brand2">Riverside Gardens<small>Buyer portal · Unit B-204</small></span><span class="sub">Jane Wanjiku · Sign out</span></div>
  <h1>Hi Jane</h1>
  ${!ready?'<div class="locked">'+lock+'<span>Your payment details will show here once your checks are done and your accounts are open.</span></div>':`
  <div class="pcols">
    <section class="card sec" aria-labelledby="pay-h">${main}${autoBox}${ach}</section>
    <section class="card sec" aria-labelledby="pp-h">
      <h2 id="pp-h">Your plan</h2>
      <div class="bal"><span>Paid so far</span><strong>${fmt("KES",paid)} <span style="font-size:14px;color:var(--ink-3);font-weight:500">of KES 9,000,000</span></strong></div>
      <ul class="feed">${sch.slice(0,3).map(s=>`<li><span class="dot ${s.paid?"in":""}"></span><span><b>${s.what} · ${fmt("KES",s.amt)}</b><small>${s.paid?"Paid "+s.paid.on:s.converting?"Ready to pay from your dollars":"Due "+s.due}</small></span></li>`).join("")}</ul>
      <div class="bal"><span>In your wallets, not yet paid</span><strong style="font-size:17px">${step===8?"USD 3,600.00":step>=9?"USD 110.27":"Nothing"}</strong></div>
    </section>
  </div>`}`;
}

function render(){
  document.getElementById("view").innerHTML = view==="deal" ? dealView() : view==="portal" ? portalView() : paymentsView();
  document.getElementById("appbar").hidden = view==="portal";
  document.querySelectorAll(".nav [data-view]").forEach(b => { if (b.dataset.view===view) b.setAttribute("aria-current","page"); else b.removeAttribute("aria-current"); });
  document.getElementById("steps").innerHTML = STEPS.map((s,i)=>`<li class="${i<step?"done":i===step?"next":""}">${s.label}</li>`).join("");
  const nx = document.getElementById("next");
  nx.disabled = step>=STEPS.length; nx.textContent = step>=STEPS.length ? "All done" : "Next step";
  document.getElementById("log").innerHTML = step===0 ? '<p class="sub">Nothing yet. Start with step 1.</p>' :
    LOG.slice(0,step).map((e,i)=>({e,i})).reverse().map(({e,i})=>`<div class="entry${i===justDone?" flash":""}"><div class="entry-h"><span>${i+1}. ${e.title}</span><span class="who ${e.who}">${e.who==="v"?"DwellOS → Verto":"DwellOS"}</span></div><p>${e.text}</p><pre>${e.code}</pre></div>`).join("");
}
function go(i){
  if (i!==step) return;
  justDone = step; step++; view = STEPS[step-1].view;
  if (step===8) { rate = 128.95; left = 60; }
  if (step===9) rate = 128.95;
  render();
  if (window.innerWidth>1100) window.scrollTo({top:0,behavior:"smooth"});
}
document.addEventListener("click", e => {
  const g = e.target.closest("[data-go]"); if (g && !g.disabled) return go(+g.dataset.go);
  const v = e.target.closest("[data-view]"); if (v) { view = v.dataset.view; justDone=-1; render(); }
});
document.addEventListener("change", e => { if (e.target.id==="auto") { auto = e.target.checked; render(); return; } const c = e.target.dataset && e.target.dataset.cur; if (c) { picked[c] = e.target.checked; if (!Object.values(picked).some(Boolean)) { picked[c]=true; e.target.checked=true; } } });
document.getElementById("next").addEventListener("click", () => go(step));
document.getElementById("reset").addEventListener("click", () => { step=0; view="deal"; justDone=-1; picked={KES:true,USD:true,GBP:false,EUR:false}; render(); });

// The portal's live quote: a new Verto rate every 30 seconds.
setInterval(() => {
  if (view!=="portal") return;
  const span = step===8 ? 60 : 30;
  left = left<=1 ? span : Math.min(left, span)-1;
  if (left===span) rate = +(128.95 + (Math.random()-0.5)*0.4).toFixed(2);
  const r = document.getElementById("q-rate"), u = document.getElementById("q-usd"), g = document.getElementById("q-ring"), l = document.getElementById("q-left");
  const usd = Math.ceil(450000/rate*100)/100;
  if (r) r.textContent = `1 USD = KES ${rate.toFixed(2)} · ${step===8?"this price holds for":"new rate in"} ${left}s`;
  if (u) u.textContent = fmt("USD", usd);
  if (l) l.textContent = `USD ${(3600-usd).toFixed(2)} will stay in your wallet.`;
  if (g) g.style.setProperty("--pct", (left/span*100)+"%");
}, 1000);

// Local screenshot mode: ?step=N&view=deal|payments&clean
const q = new URLSearchParams(location.search);
if (q.has("step")) step = Math.max(0, Math.min(STEPS.length, +q.get("step")));
if (q.get("view")) view = q.get("view");
if (q.has("clean")) document.body.classList.add("clean");
if (step===8) left = 52;
if (location.hash === "#payments") view = "payments";
if (location.hash === "#portal") view = "portal";
render();
</script>

</body></html>
